<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f4f9; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 30px 20px; }
        .dashboard-card { background: #ffffff; width: 100%; max-width: 900px; border-radius: 20px; padding: 35px 40px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.07); }
        .dash-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; padding-bottom: 15px; margin-bottom: 25px; }
        .dash-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .btn { padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: none; background: #0077ff; color: #ffffff; transition: 0.2s; }
        .btn:hover { background: #0066dc; }
        .btn:active { transform: scale(0.98); }
        .btn-logout { background: #ff4757; }
        .btn-logout:hover { background: #e84118; }
        .btn-success { background: #2ed573; }
        .btn-success:hover { background: #26af5f; }
        .btn-danger { background: #ffa502; }
        .btn-danger:hover { background: #e67e22; }
        .btn-purple { background: #8e44ad; }
        .btn-purple:hover { background: #732d91; }
        .btn-teal { background: #00b894; }
        .btn-teal:hover { background: #009475; }
        .action-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 14px; margin-bottom: 25px; }
        .action-box h4 { margin-bottom: 15px; color: #334155; font-size: 15px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: 500; color: #64748b; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 13px; border: 1.5px solid #cbd5e1; outline: none; color: #333333; transition: 0.2s; }
        .input-group input:focus { border-color: #0077ff; box-shadow: 0 0 0 2px rgba(0, 119, 255, 0.12); }
        .account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .account-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid #0077ff; }
        .account-card .acc-title { font-size: 13px; color: #64748b; text-transform: uppercase; font-weight: 600; }
        .account-card .acc-balance { font-size: 22px; font-weight: 700; color: #1e293b; }
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        table th { background-color: #f1f5f9; color: #475569; padding: 12px; border-bottom: 2px solid #e2e8f0; font-weight: 600; }
        table td { padding: 12px; border-bottom: 1px solid #edf2f7; color: #334155; }
        table tr:hover { background-color: #f8fafc; }
        .empty-state { text-align: center; color: #94a3b8; padding: 30px; font-size: 14px; }
        .section-title { color: #334155; margin: 25px 0 10px 0; font-size: 16px; }
        .hidden { display: none !important; }

        /* TOAST BİLDİRİM STİLLERİ */
        #toast-container {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 90%;
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 18px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            animation: slideIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: all 0.3s ease;
        }

        .toast.hide {
            animation: slideOut 0.3s forwards;
        }

        .toast-icon { font-size: 20px; margin-top: 2px; }
        .toast-content { flex: 1; }
        .toast-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
        .toast-message { font-size: 12.5px; line-height: 1.4; color: #555555; }
        .toast-close { background: none; border: none; font-size: 14px; color: #999999; cursor: pointer; line-height: 1; }
        .toast-close:hover { color: #333333; }

        .toast-error { border-left: 5px solid #ff4757; }
        .toast-error .toast-icon { color: #ff4757; }
        .toast-error .toast-title { color: #d63031; }

        .toast-success { border-left: 5px solid #2ed573; }
        .toast-success .toast-icon { color: #2ed573; }
        .toast-success .toast-title { color: #20bf6b; }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Toast Bildirim Kapsayıcısı -->
    <div id="toast-container"></div>

    <div class="dashboard-card">
        <div class="dash-nav">
            <div>
                <h3>User Dashboard</h3>
                <small id="userGreeting" style="color: #64748b;"></small>
            </div>
            <button class="btn btn-logout" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap
            </button>
        </div>

        <div class="dash-actions">
            <button class="btn" onclick="fetchBalances()">
                <i class="fa-solid fa-wallet"></i> Bakiyeleri Göster
            </button>
            <button class="btn btn-success" onclick="openNewAccount()">
                <i class="fa-solid fa-circle-plus"></i> Hesap Aç
            </button>
            <button class="btn btn-teal" onclick="togglePanel('addMoneyBox')">
                <i class="fa-solid fa-money-bill-wave"></i> Para Ekle
            </button>
            <button class="btn btn-purple" onclick="togglePanel('transferMoneyBox')">
                <i class="fa-solid fa-paper-plane"></i> Para Transferi
            </button>
            <button class="btn" style="background:#4b6584;" onclick="fetchTransactions()">
                <i class="fa-solid fa-receipt"></i> Hesap Hareketleri
            </button>
            <button class="btn btn-danger" onclick="togglePanel('closeAccountBox')">
                <i class="fa-solid fa-ban"></i> Hesap Kapat
            </button>
        </div>

        <!-- 1. PARA EKLE PANELİ -->
        <div id="addMoneyBox" class="action-box hidden">
            <h4><i class="fa-solid fa-money-bill-wave" style="color: #00b894;"></i> Hesaba Para Ekle</h4>
            <div class="form-grid">
                <div class="input-group">
                    <label>Hesap No</label>
                    <input type="text" id="addMoneyAccountNo" placeholder="Örn: accountno 1">
                </div>
                <div class="input-group">
                    <label>Eklenecek Miktar (₺)</label>
                    <input type="number" id="addMoneyAmount" placeholder="Örn: 100" min="1">
                </div>
            </div>
            <button class="btn btn-teal" onclick="addMoney()">Parayı Yükle</button>
        </div>

        <!-- 2. PARA TRANSFERİ PANELİ -->
        <div id="transferMoneyBox" class="action-box hidden">
            <h4><i class="fa-solid fa-paper-plane" style="color: #8e44ad;"></i> Para Transferi Yap</h4>
            <div class="form-grid">
                <div class="input-group">
                    <label>Gönderen Hesap No</label>
                    <input type="text" id="trSenderAcc" placeholder="Örn: accountno 1">
                </div>
                <div class="input-group">
                    <label>Alıcı ID</label>
                    <input type="number" id="trReceiverId" placeholder="Örn: 2">
                </div>
                <div class="input-group">
                    <label>Alıcı Hesap No</label>
                    <input type="text" id="trReceiverAcc" placeholder="Örn: accountno 2">
                </div>
                <div class="input-group">
                    <label>Alıcı Kullanıcı Adı</label>
                    <input type="text" id="trReceiverUser" placeholder="Örn: user2">
                </div>
                <div class="input-group">
                    <label>Gönderilecek Miktar</label>
                    <input type="number" id="trAmount" placeholder="Örn: 50" min="1">
                </div>
            </div>
            <button class="btn btn-purple" onclick="transferMoney()">Transferi Gerçekleştir</button>
        </div>

        <!-- 3. HESAP KAPATMA PANELİ -->
        <div id="closeAccountBox" class="action-box hidden" style="border-color: #ffb8b8; background: #fff8f8;">
            <h4 style="color: #d63031;"><i class="fa-solid fa-ban"></i> Hesap Kapat</h4>
            <div class="input-group" style="margin-bottom: 12px;">
                <label>Kapatılacak Hesap No</label>
                <input type="text" id="closeAccountInput" placeholder="Örn: accountno 1">
            </div>
            <button class="btn btn-logout" onclick="closeAccount()">Onayla ve Kapat</button>
        </div>

        <!-- HESAPLAR -->
        <h4 class="section-title">Hesaplarım</h4>
        <div id="accountsContainer" class="empty-state">
            Hesapları listelemek için "Bakiyeleri Göster" butonuna tıklayın.
        </div>

        <!-- HAREKETLER -->
        <h4 class="section-title">Hesap Hareketleri</h4>
        <div id="transactionsContainer" class="empty-state">
            Hareketleri görüntülemek için "Hesap Hareketleri" butonuna tıklayın.
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        const token = localStorage.getItem('authToken');

        if (!token) {
            window.location.href = 'login-register.html';
        }

        document.getElementById('userGreeting').innerText = `Aktif Kullanıcı: ${localStorage.getItem('currentUser') || 'Kullanıcı'}`;

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            window.location.href = 'login-register.html';
        }

        function togglePanel(panelId) {
            document.getElementById(panelId).classList.toggle('hidden');
        }

        // BİLDİRİM GÖSTERME (Toast)
        function showNotification(title, message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            
            const iconClass = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-triangle-exclamation';

            toast.innerHTML = `
                <i class="${iconClass} toast-icon"></i>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }

        // Spring Boot Hata JSON Ayrıştırıcı
        async function handleApiError(response) {
            if (response.status === 401 || response.status === 403) {
                showNotification('Oturum Hatası', 'Oturum süreniz doldu. Lütfen tekrar giriş yapın.', 'error');
                setTimeout(logout, 1500);
                return;
            }

            try {
                const errData = await response.json();
                const title = `${errData.status || response.status} ${errData.error || 'İşlem Başarısız'}`;
                const message = errData.message || 'Beklenmeyen bir hata meydana geldi.';
                showNotification(title, message, 'error');
            } catch (e) {
                const text = await response.text();
                showNotification(`Hata (${response.status})`, text || 'İşlem gerçekleştirilemedi.', 'error');
            }
        }

        // 1. BAKİYELERİ GETİR
        async function fetchBalances() {
            const container = document.getElementById('accountsContainer');
            try {
                const response = await fetch(`${API_BASE}/user/get/balance`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const accounts = await response.json();
                    if (!accounts || accounts.length === 0) {
                        container.className = 'empty-state';
                        container.innerHTML = 'Açık bir hesap bulunamadı.';
                        return;
                    }
                    container.className = 'account-grid';
                    container.innerHTML = accounts.map(acc => `
                        <div class="account-card">
                            <span class="acc-title">${acc.accountno}</span>
                            <span class="acc-balance">${acc.balance} ₺</span>
                        </div>
                    `).join('');
                    showNotification('Güncellendi', 'Hesap listesi ve bakiyeler yüklendi.', 'success');
                } else {
                    await handleApiError(response);
                }
            } catch (err) {
                showNotification('Bağlantı Hatası', 'Sunucuya bağlanılamadı.', 'error');
            }
        }

        // 2. YENİ HESAP AÇ
        async function openNewAccount() {
            try {
                const response = await fetch(`${API_BASE}/user/open/newaccount`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const msg = await response.text();
                    showNotification('Başarılı', msg || 'Yeni hesap başarıyla oluşturuldu.', 'success');
                    fetchBalances();
                } else {
                    await handleApiError(response);
                }
            } catch (err) {
                showNotification('Bağlantı Hatası', 'İstek sunucuya ulaştırılamadı.', 'error');
            }
        }

        // 3. PARA EKLE
        async function addMoney() {
            const accountNo = document.getElementById('addMoneyAccountNo').value.trim();
            const money = document.getElementById('addMoneyAmount').value;

            if (!accountNo || !money) {
                showNotification('Eksik Bilgi', 'Lütfen hesap numarası ve miktar alanlarını doldurun.', 'error');
                return;
            }

            const url = `${API_BASE}/user/add/money?money=${encodeURIComponent(money)}&accountno=${encodeURIComponent(accountNo)}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const msg = await response.text();
                    showNotification('Bakiye Eklendi', msg || 'Para yatırma işlemi başarılı.', 'success');
                    document.getElementById('addMoneyAccountNo').value = '';
                    document.getElementById('addMoneyAmount').value = '';
                    document.getElementById('addMoneyBox').classList.add('hidden');
                    fetchBalances();
                } else {
                    await handleApiError(response);
                }
            } catch (err) {
                showNotification('Bağlantı Hatası', 'İstek sunucuya ulaştırılamadı.', 'error');
            }
        }

        // 4. PARA TRANSFERİ
        async function transferMoney() {
            const senderaccountno = document.getElementById('trSenderAcc').value.trim();
            const receiverid = document.getElementById('trReceiverId').value.trim();
            const receiveraccountno = document.getElementById('trReceiverAcc').value.trim();
            const receiverusername = document.getElementById('trReceiverUser').value.trim();
            const amount = document.getElementById('trAmount').value;

            if (!senderaccountno || !receiverid || !receiveraccountno || !receiverusername || !amount) {
                showNotification('Eksik Bilgi', 'Lütfen tüm transfer alanlarını eksiksiz doldurun.', 'error');
                return;
            }

            const payload = {
                senderaccountno,
                receiverid: Number(receiverid),
                receiveraccountno,
                amount: Number(amount),
                receiverusername
            };

            try {
                const response = await fetch(`${API_BASE}/transfer/money`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const msg = await response.text();
                    showNotification('Transfer Başarılı', msg || 'Transfer tamamlandı.', 'success');
                    document.getElementById('trSenderAcc').value = '';
                    document.getElementById('trReceiverId').value = '';
                    document.getElementById('trReceiverAcc').value = '';
                    document.getElementById('trReceiverUser').value = '';
                    document.getElementById('trAmount').value = '';
                    document.getElementById('transferMoneyBox').classList.add('hidden');
                    fetchBalances();
                } else {
                    await handleApiError(response);
                }
            } catch (err) {
                showNotification('Bağlantı Hatası', 'İstek sunucuya ulaştırılamadı.', 'error');
            }
        }

        // 5. HESAP HAREKETLERİ
        async function fetchTransactions() {
            const container = document.getElementById('transactionsContainer');

            try {
                const response = await fetch(`${API_BASE}/user/get/transactions`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();

                    if (!data || data.length === 0) {
                        container.className = 'empty-state';
                        container.innerHTML = 'Herhangi bir hesap hareketi bulunamadı.';
                        return;
                    }

                    const keys = Object.keys(data[0]);

                    let tableHtml = `
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        ${keys.map(k => `<th>${k.toUpperCase()}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.map(item => `
                                        <tr>
                                            ${keys.map(k => `<td>${item[k] !== undefined && item[k] !== null ? item[k] : '-'}</td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;

                    container.className = '';
                    container.innerHTML = tableHtml;
                    showNotification('Yüklendi', 'Hesap hareketleri güncellendi.', 'success');
                } else {
                    await handleApiError(response);
                }
            } catch (err) {
                showNotification('Bağlantı Hatası', 'İstek sunucuya ulaştırılamadı.', 'error');
            }
        }

        // 6. HESAP KAPAT
        async function closeAccount() {
            const accountNo = document.getElementById('closeAccountInput').value.trim();
            if (!accountNo) {
                showNotification('Eksik Bilgi', 'Kapatılacak hesap adını/numarasını girin.', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/user/close/account?accountno=${encodeURIComponent(accountNo)}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const msg = await response.text();
                    showNotification('Hesap Kapatıldı', msg || 'Hesap başarıyla kapatıldı.', 'success');
                    document.getElementById('closeAccountInput').value = '';
                    document.getElementById('closeAccountBox').classList.add('hidden');
                    fetchBalances();
                } else {
                    await handleApiError(response);
                }
            } catch (err) {
                showNotification('Bağlantı Hatası', 'İstek sunucuya ulaştırılamadı.', 'error');
            }
        }
    </script>
</body>
</html>
